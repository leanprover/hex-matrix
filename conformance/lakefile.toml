name = "hex-matrix-conformance"
defaultTargets = ["HexMatrixConformance"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrix"
path = ".."

[[require]]
name = "hex-test-kit"
git = "https://github.com/leanprover/hex-test-kit.git"
rev = "85ab4582fbe0d86bb38f5429b17b9154fede75f0"

[[lean_lib]]
name = "HexMatrixConformance"
globs = ["HexMatrix.Conformance"]
